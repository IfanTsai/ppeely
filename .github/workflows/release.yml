# Publishes a GitHub release when a version tag such as v1.2.0 is pushed (`npm version` creates one; see "Releasing"
# in README.md). It runs the CI checks, builds the Android APK and app bundle signed with the release key, checks the
# signing certificate, and publishes the APK with SHA-256 checksums, generated release notes and a build provenance
# attestation. The app bundle (for Google Play) is kept as a workflow artifact. iOS builds are not published: they
# need an Apple developer account to sign.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Never cancel a release halfway; a second push of the same tag waits for the first run.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  # SHA-256 of the release signing certificate, also listed in README.md so users can check downloads.
  # Forks that sign with their own key must change it.
  RELEASE_CERT_SHA256: 0b0e86ba52c04eed4cbb324df0cfaf44873e3b7e9e0df4f4dde4b8d2df839115

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  android:
    needs: checks
    runs-on: ubuntu-latest
    # The signing secrets live in this environment; add required reviewers to it to approve every release by hand.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the version in package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in package.json"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      - name: Build web assets and sync the Android project
        run: |
          npm run build
          npx cap sync android

      # The secrets are created by scripts/upload-release-secrets.sh. Without them the build would silently fall back
      # to the debug key, so stop instead.
      - name: Restore the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD must be set in the release environment"
            exit 1
          fi
          mkdir -p native/android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > native/android/keystore/ppeely-release.jks
          printf 'storeFile=keystore/ppeely-release.jks\nstorePassword=%s\nkeyAlias=ppeely\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > native/android/keystore.properties

      - name: Build the signed APK and app bundle
        working-directory: native/android
        run: ./gradlew assembleRelease bundleRelease --console=plain

      - name: Check the signing certificate
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)/apksigner"
          apk=native/android/app/build/outputs/apk/release/app-release.apk
          certs="$("$apksigner" verify --print-certs "$apk")"
          # The line reads "Signer #1 certificate SHA-256 digest: …" up to build-tools 36 and "V2 Signer: certificate SHA-256 digest: …" from 37.
          actual="$(sed -n -E 's/^(Signer #1|V[0-9.]+ Signer:) certificate SHA-256 digest: ([0-9a-f]{64})$/\2/p' <<<"$certs" | head -1)"
          if [[ "$actual" != "$RELEASE_CERT_SHA256" ]]; then
            echo "$certs"
            echo "::error::The APK is signed with certificate '$actual', expected $RELEASE_CERT_SHA256"
            exit 1
          fi

      - name: Collect the release files
        run: |
          mkdir release-files
          cp native/android/app/build/outputs/apk/release/app-release.apk "release-files/ppeely-$VERSION.apk"
          (cd release-files && sha256sum -- * > SHA256SUMS.txt)
          cp native/android/app/build/outputs/bundle/release/app-release.aab "ppeely-$VERSION.aab"

      # Build provenance attestations are only available for public repositories.
      - uses: actions/attest@v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: release-files/ppeely-*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: ppeely-app-bundle
          path: ppeely-${{ env.VERSION }}.aab
          retention-days: 90

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag pushed again after a fix rebuilds the release: replace its files but keep its notes, which may have
          # been edited by hand. A new tag gets a release with notes generated from the merged pull requests.
          if gh release view "$GITHUB_REF_NAME" --json tagName >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-files/* --clobber
            exit 0
          fi
          flags=(--title "Ppeely $VERSION" --generate-notes --verify-tag)
          # Versions with a pre-release suffix (1.2.0-beta.1) are marked as pre-releases.
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release-files/* "${flags[@]}"
