apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// The app version comes from package.json, the single source of truth for both platforms.
// versionCode is derived as major * 1000000 + minor * 1000 + patch (scripts/sync-version.mjs uses the same formula
// for the iOS build number); a pre-release suffix such as -beta.1 only appears in versionName.
def appVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../../package.json')).version
def (versionMajor, versionMinor, versionPatch) = appVersion.tokenize('-')[0].tokenize('.').collect { it as int }

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.ppeely.stickers"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.ppeely.stickers"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versionMajor * 1000000 + versionMinor * 1000 + versionPatch
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    signingConfigs {
        release {
            // Release signing credentials live in native/android/keystore.properties (not committed to the repository); see the README for the fields.
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Without a release signing configuration, sign with the debug key to get an APK that can be installed and tried directly; switch to release signing before publishing to a store.
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

// io.ionic.libs:ioncamera-android, a dependency of the camera plugin, marks the test library junit as a runtime dependency in its pom,
// although its own code never references junit. Without this exclusion, junit and hamcrest get packaged into the APK and their licenses would have to ship with it.
configurations.matching { it.name.endsWith('RuntimeClasspath') && !it.name.contains('Test') }.configureEach {
    exclude group: 'junit', module: 'junit'
    exclude group: 'org.hamcrest', module: 'hamcrest-core'
}

kotlin {
    jvmToolchain(21)
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
